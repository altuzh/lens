name: Build & Release OpenLens

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build & Package Windows Installer
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: "16.20.2"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install npm 9.6.7
        run: npm install -g npm@9.6.7

      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        run: npm install

      - name: Build All Monorepo Packages
        run: npm run build

      - name: Package Windows Installer
        working-directory: open-lens
        run: npx electron-builder --win --x64 --publish never

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenLens-Setup-Windows-x64
          path: open-lens/dist/OpenLens Setup *.exe
          retention-days: 7

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v6.5.0-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'OpenLens v6.5.0 (with Pod Logs & Shell)' }}
          body: |
            ## OpenLens Custom Build

            Automated build of OpenLens with bundled extensions and fixes:
            * **Embedded Extension**: `@alebcay/openlens-node-pod-menu` (Pod Logs, Pod Shell, Pod Attach, Node Shell).
            * **Platform**: Windows x64.
            * **Bundled Kubernetes Binaries**: `kubectl.exe`, `helm.exe`, `lens-k8s-proxy.exe`.
          draft: false
          prerelease: false
          files: |
            open-lens/dist/OpenLens Setup *.exe
            open-lens/dist/OpenLens Setup *.exe.blockmap
            open-lens/dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prune-history:
    name: Keep Single Record in Action History
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Prune All Past Workflow Runs Across All Workflows
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const currentRunId = context.runId;
            const { owner, repo } = context.repo;

            console.log(`Current run ID: ${currentRunId} in ${owner}/${repo}`);

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              per_page: 100,
            });

            console.log(`Total workflow runs found: ${runs.length}`);

            for (const run of runs) {
              if (run.id === currentRunId) {
                console.log(`Keeping current run ${run.id} (${run.name})`);
                continue;
              }

              console.log(`Deleting run ${run.id} (${run.name}, status: ${run.status})...`);
              try {
                if (run.status !== 'completed') {
                  try {
                    await github.rest.actions.cancelWorkflowRun({
                      owner,
                      repo,
                      run_id: run.id,
                    });
                    console.log(`Cancelled in-progress run ${run.id}`);
                  } catch (e) {
                    console.log(`Cancel note: ${e.message}`);
                  }
                }
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                console.log(`Deleted run ${run.id}`);
              } catch (error) {
                console.error(`Failed to delete run ${run.id}: ${error.message}`);
              }
            }
